<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ชะตาแห่งอาณาจักร</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #161318;
      --panel: #221d28;
      --panel-2: #2c2533;
      --ink: #efe6d2;
      --muted: #a89c86;
      --gold: #d9b26a;
      --accent: #8fb3a0;
      --danger: #c96a5a;
      --line: #3d3446;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4ecdc;
        --panel: #fffaf0;
        --panel-2: #f0e6d0;
        --ink: #2b2118;
        --muted: #6e5f4b;
        --gold: #8a6420;
        --accent: #3f7360;
        --danger: #a84b3b;
        --line: #d8c8a6;
      }
    }
    :root[data-theme="dark"] {
      --bg: #161318;
      --panel: #221d28;
      --panel-2: #2c2533;
      --ink: #efe6d2;
      --muted: #a89c86;
      --gold: #d9b26a;
      --accent: #8fb3a0;
      --danger: #c96a5a;
      --line: #3d3446;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans Thai", system-ui, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 4px; color: var(--gold); }
    h2 { font-size: 1.15rem; margin: 0 0 8px; }
    p { margin: 0 0 12px; }
    .subtitle { color: var(--muted); margin-bottom: 20px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .origin {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      font: inherit;
      cursor: pointer;
    }
    .origin:hover, .origin:focus-visible { border-color: var(--gold); outline: none; }
    .origin strong { display: block; font-size: 1.05rem; color: var(--gold); }
    .origin span { color: var(--muted); font-size: 0.92rem; }
    .btn {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--panel-2);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font: inherit;
      cursor: pointer;
    }
    .btn:hover, .btn:focus-visible { border-color: var(--accent); outline: none; }
    .btn small { display: block; color: var(--muted); font-size: 0.85rem; }
    .btn.primary { background: var(--accent); color: #101512; border-color: var(--accent); text-align: center; font-weight: 600; }
    .hint { color: var(--muted); font-size: 0.88rem; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 14px;
      font-size: 0.95rem;
    }
    .stats div { display: flex; justify-content: space-between; }
    .stats b { color: var(--gold); font-weight: 600; }
    .bar {
      height: 8px;
      background: var(--panel-2);
      border-radius: 4px;
      overflow: hidden;
      margin: 6px 0 12px;
    }
    .bar > i { display: block; height: 100%; background: var(--accent); }
    .bar > i.low { background: var(--danger); }
    .year { color: var(--gold); font-weight: 600; margin-bottom: 6px; }
    .result { border-left: 3px solid var(--gold); padding-left: 12px; margin: 12px 0; }
    .roll { color: var(--muted); font-size: 0.88rem; margin-bottom: 10px; }
    .log { max-height: 220px; overflow-y: auto; font-size: 0.9rem; }
    .log p { margin: 0 0 6px; color: var(--muted); }
    .log p b { color: var(--gold); font-weight: 600; margin-right: 6px; }
    details summary { cursor: pointer; color: var(--gold); margin-bottom: 8px; }
    .title { font-size: 1.4rem; color: var(--gold); margin: 6px 0 12px; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
