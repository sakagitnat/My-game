<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0814">
  <title>ชะตาแห่งอาณาจักร</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #ecc77e;
      --gold-hi: #fbe6ae;
      --gold-deep: #9c7326;
      --ink: #f4ead5;
      --muted: #b9ab93;
      --panel: rgba(16, 11, 26, 0.86);
      --panel-2: rgba(42, 30, 58, 0.9);
      --line: rgba(236, 199, 126, 0.5);
      --good: #8fe0a8;
      --bad: #ff8a7a;
      --display: "Chonburi", "Noto Sans Thai", serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: #0b0814;
      color: var(--ink);
      font-family: "Noto Sans Thai", system-ui, sans-serif;
      line-height: 1.6;
      user-select: none;
    }
    button { font: inherit; color: inherit; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    }
    .screen {
      max-width: 640px;
      min-height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fade-in .6s ease both;
    }
    .spacer { flex: 1 1 auto; min-height: 8px; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 20px; height: 20px; flex: none; display: inline-block; vertical-align: middle; }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes shimmer { 0% { transform: translateX(-120%) skewX(-20deg); } 60%, 100% { transform: translateX(220%) skewX(-20deg); } }
    @keyframes glow-pulse { 0%, 100% { filter: drop-shadow(0 0 12px rgba(236, 199, 126, .35)); } 50% { filter: drop-shadow(0 0 22px rgba(236, 199, 126, .65)); } }

    /* ---------- ปุ่ม ---------- */
    .btn-gold {
      position: relative;
      overflow: hidden;
      display: block;
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #fbe7b0;
      border-radius: 12px;
      background: linear-gradient(180deg, #f6dc98 0%, #d7a64c 55%, #b78431 100%);
      color: #2a1806;
      font-family: var(--display);
      font-size: 1.15rem;
      letter-spacing: .02em;
      text-shadow: 0 1px 0 rgba(255, 245, 210, .6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -3px 0 rgba(90, 50, 10, .35), 0 8px 22px rgba(0, 0, 0, .5), 0 0 24px rgba(236, 199, 126, .25);
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease;
    }
    .btn-gold::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent);
      animation: shimmer 3.6s ease-in-out infinite;
    }
    .btn-gold:hover { filter: brightness(1.06); }
    .btn-gold:active { transform: scale(.98); }
    .btn-gold:disabled { filter: grayscale(.8) brightness(.6); cursor: default; }
    .btn-gold:disabled::after { display: none; }
    .btn-ghost {
      display: block;
      width: 100%;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(16, 11, 26, .55);
      color: var(--gold);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
    }
    .btn-ghost:hover { background: rgba(40, 28, 58, .7); }
    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: none;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(16, 11, 26, .6);
      color: var(--gold);
      cursor: pointer;
    }
    .icon-btn .icon { width: 20px; height: 20px; }
    .icon-btn:hover { background: rgba(50, 36, 70, .8); }

    /* ---------- กรอบประดับ ---------- */
    .frame {
      position: relative;
      background: linear-gradient(180deg, var(--panel), rgba(10, 7, 18, .94));
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: inset 0 0 0 3px rgba(10, 7, 18, .9), inset 0 0 0 4px rgba(236, 199, 126, .22), 0 18px 50px rgba(0, 0, 0, .6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .corner { position: absolute; width: 34px; height: 34px; color: var(--gold); pointer-events: none; opacity: .9; }
    .corner.tl { top: -3px; left: -3px; }
    .corner.tr { top: -3px; right: -3px; transform: scaleX(-1); }
    .corner.bl { bottom: -3px; left: -3px; transform: scaleY(-1); }
    .corner.br { bottom: -3px; right: -3px; transform: scale(-1, -1); }
    .plaque {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -55%);
      max-width: calc(100% - 64px);
      padding: 5px 22px 3px;
      border: 1px solid var(--gold);
      border-radius: 8px;
      background: linear-gradient(180deg, #4a3256, #24162e);
      color: var(--gold-hi);
      font-family: var(--display);
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .15);
    }

    /* ---------- หน้าแรก ---------- */
    .logo { text-align: center; margin-top: 7vh; animation: rise-in 1.2s ease both; }
    .logo-kicker { color: var(--gold); letter-spacing: .2em; font-size: .85rem; margin: 0 0 6px; opacity: .9; }
    .logo-title {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      line-height: 1.25;
      background: linear-gradient(180deg, #fff6d6 0%, #f2cf7e 45%, #b9842e 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: glow-pulse 4s ease-in-out infinite;
    }
    .logo-title .big { display: block; font-size: clamp(3.2rem, 15vw, 5.2rem); }
    .logo-title .small { display: block; font-size: clamp(1.4rem, 6.4vw, 2.2rem); }
    .ornament { display: block; width: 220px; height: 18px; margin: 10px auto 0; color: var(--gold); }
    .title-actions { display: grid; gap: 10px; animation: rise-in 1.2s .4s ease both; }
    .corner-tools { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px; }
    .credit { text-align: center; color: var(--muted); font-size: .78rem; opacity: .8; margin: 2px 0 0; }

    /* ---------- เลือกต้นกำเนิด ---------- */
    .create-head { text-align: center; }
    .create-head h2 { margin: 6px 0 0; font-family: var(--display); font-weight: 400; color: var(--gold-hi); font-size: 1.5rem; }
    .create-head p { margin: 0; color: var(--muted); font-size: .9rem; }
    .origins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .origin-card {
      position: relative;
      text-align: left;
      padding: 0;
      border: 1px solid rgba(236, 199, 126, .35);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(16, 11, 26, .82);
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
      animation: rise-in .6s ease both;
    }
    .origin-card:hover { transform: translateY(-2px); }
    .origin-card.selected { border-color: var(--gold-hi); box-shadow: 0 0 0 2px var(--gold), 0 0 28px rgba(236, 199, 126, .45); }
    .origin-card canvas { display: block; width: 100%; aspect-ratio: 16 / 10; }
    .origin-card .crest { position: absolute; top: 6px; left: 6px; width: 38px; height: 44px; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .6)); }
    .origin-info { padding: 8px 10px 10px; }
    .origin-info h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1rem; color: var(--gold-hi); line-height: 1.4; }
    .origin-info p { margin: 2px 0 6px; font-size: .78rem; color: var(--muted); line-height: 1.45; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 8px 1px 4px;
      border-radius: 999px;
      font-size: .76rem;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .1);
    }
    .chip .icon { width: 15px; height: 15px; }
    .chip.up { color: var(--good); }
    .chip.down { color: var(--bad); }
    .name-row { display: flex; gap: 8px; align-items: center; padding: 10px 12px; }
    .name-row label { color: var(--gold); font-size: .9rem; white-space: nowrap; }
    .name-row input {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(0, 0, 0, .35);
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
      user-select: text;
    }
    .name-row input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
    .link-btn { background: none; border: 0; color: var(--muted); padding: 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

    /* ---------- HUD ---------- */
    .hud {
      padding: 10px 12px 10px;
      display: grid;
      gap: 8px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(16, 11, 26, .78), rgba(16, 11, 26, .6));
      border: 1px solid rgba(236, 199, 126, .35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
      animation: rise-in .6s ease both;
    }
    .hud-top { display: flex; align-items: center; gap: 10px; }
    .medallion {
      width: 50px;
      height: 50px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #4a3460, #160e22);
      border: 2px solid var(--gold);
      box-shadow: 0 0 0 3px rgba(10, 7, 18, .8), 0 0 16px rgba(236, 199, 126, .35);
    }
    .medallion svg { width: 32px; height: 38px; }
    .who { flex: 1; min-width: 0; }
    .who .name { font-family: var(--display); color: var(--gold-hi); font-size: 1.08rem; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who .meta { color: var(--muted); font-size: .82rem; }
    .who .meta b { color: var(--ink); font-weight: 700; }
    .who .meta2 { color: var(--gold); font-size: .76rem; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hp { display: flex; align-items: center; gap: 8px; }
    .hp .icon { width: 22px; height: 22px; }
    .hp-track {
      position: relative;
      flex: 1;
      height: 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .55);
      border: 1px solid rgba(236, 199, 126, .35);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .6);
      overflow: hidden;
    }
    .hp-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff8a7a, #d23a42 55%, #8e1a2a);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35);
      transition: width .7s cubic-bezier(.2, .8, .2, 1);
    }
    .hp.low .hp-fill { animation: low-pulse 1s ease-in-out infinite; }
    @keyframes low-pulse { 50% { filter: brightness(1.6); } }
    .hp-value { min-width: 54px; text-align: right; font-family: var(--display); font-size: .9rem; color: var(--ink); }
    .attrs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
    .attr {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 5px 2px 3px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .08);
    }
    .attr .icon { width: 22px; height: 22px; }
    .attr span { font-family: var(--display); font-size: .88rem; line-height: 1.3; }
    .attr small { font-size: .62rem; color: var(--muted); line-height: 1.1; }
    .bump { animation: bump .6s ease; }
    @keyframes bump { 30% { transform: scale(1.18); background: rgba(236, 199, 126, .25); } }
    .float {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      font-family: var(--display);
      font-size: .95rem;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, .8);
      animation: float-up 1.4s ease-out forwards;
      white-space: nowrap;
    }
    .float.up { color: var(--good); }
    .float.down { color: var(--bad); }
    @keyframes float-up { from { opacity: 0; transform: translate(-50%, 10px); } 15% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -34px); } }

    /* ---------- แผงเรื่องราว ---------- */
    .panel { padding: 22px 16px 16px; animation: rise-in .45s ease both; }
    .panel.swap { animation: none; }
    .panel.swap > .body { animation: rise-in .4s ease both; }
    .story { margin: 4px 0 12px; font-size: 1.04rem; line-height: 1.75; min-height: 3.4em; }
    .story.typing::after { content: "▍"; color: var(--gold); animation: fade-in .5s steps(2) infinite alternate; }
    .choices { display: grid; gap: 9px; }
    .choice {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      text-align: left;
      border: 1px solid rgba(236, 199, 126, .32);
      border-radius: 12px;
      background: linear-gradient(180deg, var(--panel-2), rgba(26, 18, 38, .92));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
      cursor: pointer;
      animation: rise-in .4s ease both;
      transition: border-color .15s ease, box-shadow .15s ease, transform .12s ease;
    }
    .choice:hover, .choice:focus-visible { outline: none; border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 22px rgba(236, 199, 126, .25); }
    .choice:active { transform: scale(.985); }
    .choice:disabled { opacity: .5; cursor: default; }
    .choice.picked { opacity: 1; border-color: var(--gold-hi); }
    .choice.locked { opacity: .55; filter: grayscale(.6); }
    .choice-text .need { color: var(--bad); }
    .death-line { margin: 0 0 14px; padding: 8px 12px; border-left: 3px solid var(--bad); color: #ffd0c8; background: rgba(120, 20, 30, .25); border-radius: 0 8px 8px 0; }
    .gem {
      width: 38px;
      height: 38px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3e2c52, #120c1c);
      border: 1px solid rgba(236, 199, 126, .55);
    }
    .gem .icon { width: 22px; height: 22px; }
    .choice-text { flex: 1; min-width: 0; }
    .choice-text strong { display: block; font-weight: 500; line-height: 1.4; }
    .choice-text small { display: block; color: var(--muted); font-size: .8rem; }
    .chance {
      flex: none;
      min-width: 52px;
      padding: 3px 8px;
      border-radius: 8px;
      text-align: center;
      font-family: var(--display);
      font-size: .95rem;
      line-height: 1.2;
      background: rgba(0, 0, 0, .35);
      border: 1px solid currentColor;
    }
    .chance small { display: block; font-family: "Noto Sans Thai", sans-serif; font-size: .6rem; opacity: .85; }
    .chance.good { color: var(--good); }
    .chance.mid { color: #ffd27a; }
    .chance.bad { color: var(--bad); }
    .verdict { margin: 2px 0 4px; font-family: var(--display); font-size: 1.25rem; }
    .verdict.ok { color: var(--good); }
    .verdict.bad { color: var(--bad); }
    .roll-line { margin: 0 0 6px; color: var(--muted); font-size: .85rem; }
    .delta-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
    .delta-row .chip { font-size: .85rem; padding: 3px 10px 3px 5px; animation: rise-in .4s ease both; }
    .years { display: grid; gap: 4px; min-height: 9.5em; align-content: end; }
    .year-line { display: flex; gap: 10px; align-items: baseline; animation: rise-in .35s ease both; color: var(--ink); font-size: .95rem; }
    .year-line b { flex: none; min-width: 58px; font-family: var(--display); font-weight: 400; color: var(--gold); font-size: .9rem; }
    .year-line.old { opacity: .45; }
    .year-line.death { color: var(--bad); }
    .tap-hint { margin: 10px 0 0; text-align: center; color: var(--muted); font-size: .78rem; letter-spacing: .05em; }

    /* ---------- ชั้นซ้อนบนสุด: บท ลูกเต๋า หน้าต่าง ---------- */
    #overlay, #modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px 16px;
      z-index: 5;
    }
    #overlay.show, #modal.show { display: grid; }
    #overlay { background: radial-gradient(ellipse at center, rgba(10, 6, 20, .72), rgba(4, 2, 10, .94)); animation: fade-in .4s ease both; }
    #modal { background: rgba(4, 2, 10, .7); z-index: 6; }
    .chapter { text-align: center; cursor: pointer; }
    .chapter.leave { animation: fade-out .45s ease forwards; }
    @keyframes fade-out { to { opacity: 0; transform: scale(1.04); } }
    .chapter-num { margin: 0; color: var(--gold); letter-spacing: .35em; font-size: .95rem; animation: rise-in .8s ease both; }
    .chapter-name {
      margin: 6px 0 0;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(2.4rem, 11vw, 3.6rem);
      line-height: 1.3;
      background: linear-gradient(180deg, #fff6d6, #e8b85c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rise-in .9s .15s ease both;
    }
    .chapter .ornament { animation: grow-x 1s .3s ease both; }
    @keyframes grow-x { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: 1; } }
    .chapter-line { margin: 12px 0 0; color: var(--ink); opacity: .85; font-size: 1rem; animation: rise-in 1s .5s ease both; }

    .dice-wrap { text-align: center; }
    .dice-info { margin: 0 0 10px; color: var(--gold); font-size: 1rem; }
    .d20 { width: 150px; height: 150px; filter: drop-shadow(0 0 22px rgba(160, 120, 255, .55)); animation: dice-spin 1.1s cubic-bezier(.2, .7, .2, 1) both; }
    .d20.landed { animation: dice-land .35s ease both; }
    @keyframes dice-spin { from { transform: rotate(-720deg) scale(.3); opacity: 0; } 40% { opacity: 1; } to { transform: rotate(0) scale(1); } }
    @keyframes dice-land { 50% { transform: scale(1.15); } }
    .d20 .num { font-family: var(--display); font-size: 26px; fill: #fff6d6; }
    .dice-total { margin: 10px 0 0; min-height: 1.6em; color: var(--ink); }
    .stamp {
      margin: 6px auto 0;
      display: inline-block;
      padding: 4px 22px;
      border: 3px solid currentColor;
      border-radius: 10px;
      font-family: var(--display);
      font-size: 1.8rem;
      opacity: 0;
      transform: scale(2) rotate(-10deg);
    }
    .stamp.show { animation: stamp .35s cubic-bezier(.2, 1.4, .4, 1) forwards; }
    .stamp.ok { color: var(--good); text-shadow: 0 0 18px rgba(143, 224, 168, .6); }
    .stamp.bad { color: var(--bad); text-shadow: 0 0 18px rgba(255, 138, 122, .6); }
    @keyframes stamp { to { opacity: 1; transform: scale(1) rotate(-6deg); } }

    .modal-card { width: min(560px, 100%); max-height: 80vh; display: flex; flex-direction: column; padding: 22px 16px 14px; animation: rise-in .35s ease both; }
    .modal-card h2 { margin: 0 0 10px; text-align: center; font-family: var(--display); font-weight: 400; color: var(--gold-hi); font-size: 1.3rem; }
    .modal-list { overflow-y: auto; display: grid; gap: 6px; padding-right: 4px; margin-bottom: 12px; user-select: text; }
    .modal-list .year-line { animation: none; }
    .title-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .05); }
    .title-item.locked { opacity: .45; }
    .title-item .icon { width: 22px; height: 22px; }
    .title-text strong { display: block; font-weight: 500; }
    .title-text small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.4; }

    /* ---------- จบชีวิต ---------- */
    .scroll {
      position: relative;
      margin: 18px 4px;
      padding: 26px 20px 20px;
      color: #3a2412;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, .35), transparent 60%),
        linear-gradient(180deg, #f6e6c2, #e8cf9c 60%, #dcbd84);
      border-radius: 6px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .6), inset 0 0 40px rgba(120, 70, 20, .3);
      animation: rise-in .9s .3s ease both;
    }
    .scroll::before, .scroll::after {
      content: "";
      position: absolute;
      left: -10px;
      right: -10px;
      height: 18px;
      border-radius: 9px;
      background: linear-gradient(180deg, #c89a52, #7a4e1e 50%, #4a2c10);
      box-shadow: 0 4px 10px rgba(0, 0, 0, .5);
    }
    .scroll::before { top: -12px; }
    .scroll::after { bottom: -12px; }
    .epitaph-kicker { margin: 0; font-size: .85rem; color: #7a5a3a; letter-spacing: .08em; }
    .epitaph-name { margin: 2px 0 6px; font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1.3; color: #3a1e0a; }
    .ribbon {
      position: relative;
      display: inline-block;
      margin: 2px 0 10px;
      padding: 6px 26px;
      background: linear-gradient(180deg, #b8323a, #7e1820);
      color: #ffe8b0;
      font-family: var(--display);
      font-size: 1.1rem;
      box-shadow: 0 6px 12px rgba(80, 10, 10, .4);
    }
    .ribbon::before, .ribbon::after {
      content: "";
      position: absolute;
      top: 6px;
      border: 18px solid #6a1018;
      z-index: -1;
    }
    .ribbon::before { left: -22px; border-left-color: transparent; }
    .ribbon::after { right: -22px; border-right-color: transparent; }
    .new-title { margin: 0 0 8px; color: #9a5a0a; font-weight: 700; animation: glow-pulse 2s ease-in-out infinite; }
    .ending-text { margin: 0 0 12px; font-size: .98rem; line-height: 1.75; color: #3a2412; font-style: italic; }
    .epitaph-age { margin: 0; font-family: var(--display); font-size: 1.05rem; }
    .epitaph-profile { margin: 0; font-size: .85rem; color: #7a5a3a; }
    .epitaph-cause { margin: 2px 0 12px; font-size: .9rem; color: #6a4a2a; }
    .end-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0 12px; }
    .end-stats div { display: flex; flex-direction: column; align-items: center; padding: 6px 2px; border-radius: 10px; background: rgba(120, 70, 20, .1); font-size: .72rem; color: #6a4a2a; }
    .end-stats b { font-family: var(--display); font-weight: 400; font-size: 1rem; color: #3a1e0a; }
    .end-stats .icon { width: 22px; height: 22px; }
    .moments { text-align: left; margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .88rem; }
    .moments li { display: flex; gap: 8px; }
    .moments b { flex: none; min-width: 52px; font-family: var(--display); font-weight: 400; color: #8a5a1a; }
    .moments-title { margin: 6px 0 6px; font-family: var(--display); font-weight: 400; font-size: 1rem; color: #5a3a1a; }
    .end-actions { display: grid; gap: 10px; margin-top: 4px; animation: rise-in .8s .8s ease both; }

    @media (min-width: 900px) {
      .story { font-size: 1.1rem; }
    }
    /* จอกว้าง: วาง HUD และแผงเรื่องไว้คอลัมน์ซ้าย ให้ฉากด้านขวาโล่ง */
    @media (min-width: 960px) and (min-aspect-ratio: 5/4) {
      .screen.game { max-width: none; margin: 0 0 0 2vw; align-items: flex-start; }
      .screen.game > .hud, .screen.game > .panel { width: min(470px, 40vw); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; transition: none !important; }
    }
  </style>
