<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ชะตาแห่งอาณาจักร</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #1b1530;
      --bg-bottom: #0d0b14;
      --panel: #2a2236;
      --panel-2: #342b44;
      --parchment: #f1e2bd;
      --parchment-ink: #3a2a18;
      --ink: #f3e9d2;
      --muted: #b3a68f;
      --gold: #e2bd72;
      --gold-deep: #9c7326;
      --accent: #8fd3b0;
      --danger: #e0695b;
      --line: #4a3d5c;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg-top: #f7e9c9;
        --bg-bottom: #e9d4a6;
        --panel: #fff8e6;
        --panel-2: #f3e5c3;
        --parchment: #f6ebd0;
        --parchment-ink: #3a2a18;
        --ink: #2b1f12;
        --muted: #6e5a3f;
        --gold: #8a5f16;
        --gold-deep: #6b4810;
        --accent: #2f7a5c;
        --danger: #a84b3b;
        --line: #d2b77c;
        --shadow: 0 10px 24px rgba(90, 60, 20, .18);
      }
    }
    :root[data-theme="dark"] {
      --bg-top: #1b1530;
      --bg-bottom: #0d0b14;
      --panel: #2a2236;
      --panel-2: #342b44;
      --ink: #f3e9d2;
      --muted: #b3a68f;
      --gold: #e2bd72;
      --line: #4a3d5c;
      --accent: #8fd3b0;
      --danger: #e0695b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, var(--bg-top), var(--bg-bottom) 70%) fixed;
      background-color: var(--bg-bottom);
      color: var(--ink);
      font-family: "Noto Sans Thai", system-ui, sans-serif;
      line-height: 1.65;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 16px 56px;
    }
    h1, h2, .title {
      font-family: "Noto Serif Thai", "Noto Sans Thai", serif;
      margin: 0;
    }
    h1 {
      font-size: 1.7rem;
      color: var(--gold);
      text-shadow: 0 2px 0 rgba(0, 0, 0, .3);
      text-align: center;
    }
    h2 { font-size: 1.1rem; margin-bottom: 8px; color: var(--gold); }
    p { margin: 0 0 12px; }
    .ornament { display: block; width: 160px; height: 14px; margin: 6px auto 14px; }
    .subtitle { color: var(--muted); text-align: center; margin-bottom: 18px; }

    /* ฉากประกอบและกรอบ */
    .scene {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--gold-deep);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      aspect-ratio: 2 / 1;
      background: #2a2236;
    }
    .scene svg { display: block; width: 100%; height: 100%; }
    .scene-label {
      position: absolute;
      left: 10px;
      bottom: 10px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(20, 14, 30, .72);
      color: var(--gold);
      font-family: "Noto Serif Thai", serif;
      font-size: .9rem;
      border: 1px solid var(--gold-deep);
    }
    .year {
      text-align: center;
      font-family: "Noto Serif Thai", serif;
      color: var(--gold);
      font-size: 1.15rem;
      margin: 4px 0 10px;
    }

    .card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .card.parchment {
      background: linear-gradient(160deg, #f6ebd0, #e8d3a5);
      color: var(--parchment-ink);
      border-color: #b8924f;
    }
    .card.parchment h2 { color: #6b4810; }
    .card.parchment::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px dashed rgba(107, 72, 16, .35);
      border-radius: 10px;
      pointer-events: none;
    }

    /* อาชีพตอนเริ่ม */
    .origin {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left;
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font: inherit;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform .15s ease, border-color .15s ease;
    }
    .origin svg { width: 56px; height: 56px; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .4)); }
    .origin:hover, .origin:focus-visible {
      border-color: var(--gold);
      transform: translateY(-2px);
      outline: none;
    }
    .origin strong { display: block; font-family: "Noto Serif Thai", serif; font-size: 1.05rem; color: var(--gold); }
    .origin span { color: var(--muted); font-size: .92rem; }

    /* ปุ่มเลือกทาง */
    .btn {
      display: block;
      width: 100%;
      text-align: left;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      color: var(--ink);
      border: 1px solid var(--line);
      border-left: 4px solid var(--gold-deep);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font: inherit;
      cursor: pointer;
      transition: border-color .15s ease, transform .15s ease;
    }
    .btn:hover, .btn:focus-visible { border-color: var(--gold); border-left-color: var(--gold); transform: translateX(3px); outline: none; }
    .btn small { display: block; color: var(--muted); font-size: .85rem; }
    .btn.primary {
      background: linear-gradient(180deg, #9fe0bf, #5fb08b);
      color: #0f1d16;
      border-color: #7fd0a8;
      text-align: center;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .btn.primary:hover { border-color: #c9f3dc; transform: translateY(-1px); }

    /* ค่าสถานะ */
    .hint { color: var(--muted); font-size: .9rem; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 14px;
      font-size: .95rem;
      margin-top: 10px;
    }
    .stats > div { display: flex; align-items: center; gap: 8px; }
    .stats svg { width: 22px; height: 22px; flex: none; }
    .stats b { margin-left: auto; color: var(--gold); font-weight: 700; }
    .bar {
      height: 10px;
      background: rgba(0, 0, 0, .3);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      margin: 6px 0 4px;
    }
    .bar > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #5fb08b, #9fe0bf);
      transition: width .5s ease;
    }
    .bar > i.low { background: linear-gradient(90deg, #a84b3b, #e0695b); }

    /* เหตุการณ์และการทอยเต๋า */
    .result { border-left: 3px solid var(--gold-deep); padding-left: 12px; margin: 12px 0; }
    .roll {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #5b4424;
      font-size: .92rem;
      margin-bottom: 10px;
    }
    .die { width: 46px; height: 46px; flex: none; animation: spin .6s ease-out; }
    @keyframes spin {
      0% { transform: rotate(-200deg) scale(.6); opacity: 0; }
      100% { transform: rotate(0) scale(1); opacity: 1; }
    }
    .pass { color: #2f7a5c; font-weight: 700; }
    .fail { color: #a84b3b; font-weight: 700; }

    .log { max-height: 240px; overflow-y: auto; font-size: .9rem; }
    .log p { margin: 0 0 8px; color: var(--muted); padding-left: 10px; border-left: 2px solid var(--line); }
    .log p b { color: var(--gold); font-weight: 600; margin-right: 6px; }
    details summary { cursor: pointer; color: var(--gold); font-family: "Noto Serif Thai", serif; }
    .title {
      text-align: center;
      font-size: 1.5rem;
      color: var(--gold);
      margin: 8px 0 4px;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .3);
    }
    .end-ending { text-align: center; color: var(--muted); margin-bottom: 14px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script src="engine.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
