name: Build Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'build-tools;36.0.0' 'platforms;android-36'
      - name: Install Godot and export templates
        shell: bash
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Configure Android export
        shell: bash
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Import and test
        run: |
          godot --headless --path . --editor --quit
          XDG_DATA_HOME=/tmp/tavern-tests godot --headless --path . --script tests/smoke.gd
          XDG_DATA_HOME=/tmp/tavern-tests godot --headless --path . --script tests/phase1.gd
          XDG_DATA_HOME=/tmp/tavern-tests godot --headless --path . --script tests/phase2.gd
          XDG_DATA_HOME=/tmp/tavern-tests godot --headless --path . --script tests/progress.gd
          XDG_DATA_HOME=/tmp/tavern-tests godot --headless --path . --script tests/obstacles.gd
          XDG_DATA_HOME=/tmp/tavern-tests godot --headless --path . --script tests/view_state.gd
          XDG_DATA_HOME=/tmp/tavern-tests godot --headless --path . --script tests/restaurant.gd
          XDG_DATA_HOME=/tmp/tavern-tests godot --headless --path . --script tests/names.gd
          XDG_DATA_HOME=/tmp/tavern-tests godot --headless --path . --script tests/scenes.gd
          XDG_DATA_HOME=/tmp/tavern-tests godot --headless --path . --script tests/editor.gd
          XDG_DATA_HOME=/tmp/tavern-tests godot --headless --path . --script tests/assets_check.gd
      - name: Export test APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/salvora.apk
      - uses: actions/upload-artifact@v4
        with:
          name: salvora-android
          path: build/salvora.apk
          if-no-files-found: error
          retention-days: 7
