name: Deploy Salvora web (iPad)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and web export template
        shell: bash
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -j -q /tmp/templates.zip 'templates/web_nothreads_release.zip' 'templates/version.txt' -d "$T"
      - name: Import and test
        run: |
          godot --headless --path . --editor --quit
          XDG_DATA_HOME=/tmp/salvora-tests godot --headless --path . --script tests/phase1.gd
          XDG_DATA_HOME=/tmp/salvora-tests godot --headless --path . --script tests/phase2.gd
          XDG_DATA_HOME=/tmp/salvora-tests godot --headless --path . --script tests/progress.gd
          XDG_DATA_HOME=/tmp/salvora-tests godot --headless --path . --script tests/obstacles.gd
          XDG_DATA_HOME=/tmp/salvora-tests godot --headless --path . --script tests/view_state.gd
          XDG_DATA_HOME=/tmp/salvora-tests godot --headless --path . --script tests/restaurant.gd
          XDG_DATA_HOME=/tmp/salvora-tests godot --headless --path . --script tests/names.gd
          XDG_DATA_HOME=/tmp/salvora-tests godot --headless --path . --script tests/scenes.gd
          XDG_DATA_HOME=/tmp/salvora-tests godot --headless --path . --script tests/editor.gd
          XDG_DATA_HOME=/tmp/salvora-tests godot --headless --path . --script tests/rotate.gd
          XDG_DATA_HOME=/tmp/salvora-tests godot --headless --path . --script tests/assets_check.gd
      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.wasm
          touch build/web/.nojekyll
      - name: Include drawing workshop
        run: |
          if [ -f assets/td/art_workshop/index.html ]; then
            mkdir -p build/web/art-workshop
            cp assets/td/art_workshop/index.html build/web/art-workshop/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
