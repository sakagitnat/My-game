<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161c24"><title>Tiny Tavern — ร้านอาหารเล็ก ๆ</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><small>ร้านเล็ก ๆ ในโลกแฟนตาซี</small><h1>Tiny Tavern</h1></div><div class="stats"><span>🪙 <b id="coins">0</b></span><span>เสิร์ฟ <b id="served">0</b></span><span>ครัว Lv.<b id="level">1</b></span></div></header><section class="scene"><canvas id="scene" width="1100" height="560" aria-label="ร้านอาหาร แตะลูกค้าเพื่อเสิร์ฟ"></canvas><div class="tag">เปิดร้าน • ลูกค้ารอ 60 วินาที</div></section><p id="message" role="status" aria-live="polite">แตะเมนูเพื่อทำอาหาร แล้วแตะลูกค้าเพื่อเสิร์ฟ</p><section class="controls"><button data-dish="0">🍲 ซุป <span>พร้อม <b id="stock0">0</b> • ขาย 18 เหรียญ</span></button><button data-dish="1">🥐 ขนมปัง <span>พร้อม <b id="stock1">0</b> • ขาย 14 เหรียญ</span></button><button data-dish="2">🍹 น้ำผลไม้ <span>พร้อม <b id="stock2">0</b> • ขาย 12 เหรียญ</span></button><button id="upgrade">✨ อัปเกรดครัว<span id="cost">60 เหรียญ</span></button></section><progress id="cook-progress" max="1" value="0" aria-label="ความคืบหน้าการทำอาหาร"></progress><section class="orders" id="orders" aria-label="รายการลูกค้า"></section><footer>ทำอาหารฟรีในต้นแบบนี้ • แตะลูกค้า หรือปุ่มเสิร์ฟด้านล่าง • เซฟอัตโนมัติในเบราว์เซอร์นี้</footer></main><script src="game.js"></script><script src="app.js"></script></body></html>
